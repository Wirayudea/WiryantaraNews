services:
  - type: web
    name: newsradar-topic-analyzer
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt && python -m nltk.downloader averaged_perceptron_tagger punkt stopwords
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: NLTK_DATA
        value: /opt/render/.nltk_data
